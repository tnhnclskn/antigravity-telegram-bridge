<!DOCTYPE html>
<html lang="tr" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{ title }} - Güvenli Giriş</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex flex-col justify-between items-center p-4 sm:p-6 font-sans selection:bg-purple-500 selection:text-white antialiased">

    <div></div>

    <!-- Login Card Container -->
    <div class="w-full max-w-sm sm:max-w-md bg-slate-900 border border-slate-800/80 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-5 sm:space-y-6 animate-in fade-in zoom-in-95 duration-200 my-auto">
        <!-- Logo & Title -->
        <div class="text-center space-y-2 sm:space-y-3">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center mx-auto shadow-lg shadow-purple-500/30">
                <i data-lucide="shield-lock" class="w-6 h-6 sm:w-7 sm:h-7 text-white"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Antigravity Hub</h1>
            <p class="text-xs text-slate-400">Devam etmek için erişim tokeninizi girin veya Magic Link kullanın.</p>
        </div>

        {% if error %}
        <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-xs flex items-center gap-2">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400 shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <div id="error-msg" class="hidden p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-xs flex items-center gap-2">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400 shrink-0"></i>
            <span id="error-text">Geçersiz erişim tokeni</span>
        </div>

        <!-- Token Form -->
        <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); submitLogin();">
            <div class="space-y-1.5">
                <label for="input-token" class="block text-xs font-semibold text-slate-300">Erişim Tokeni (Access Token)</label>
                <div class="relative">
                    <input
                        type="password"
                        id="input-token"
                        required
                        placeholder="Tokeninizi buraya yapıştırın..."
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-slate-100 text-base sm:text-xs font-mono focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none transition"
                    />
                    <button
                        type="button"
                        onclick="toggleTokenVisibility()"
                        class="absolute right-3 top-3.5 text-slate-500 hover:text-slate-300 touch-manipulation"
                        aria-label="Tokeni Göster/Gizle"
                    >
                        <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="btn-submit"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:bg-purple-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-purple-600/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-xs sm:text-xs touch-manipulation"
            >
                <span>Giriş Yap</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="pt-1 text-center text-[11px] text-slate-500">
            <span>🛡️ Uçtan uca güvenli oturum yönetimi</span>
        </div>
    </div>

    <!-- Footer with Çekirdekod branding -->
    <footer class="py-4 text-center text-xs text-slate-500 flex flex-col items-center gap-2">
        <a href="https://cekirdekod.com/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 opacity-80 hover:opacity-100 transition" title="Çekirdekod">
            <img src="https://cekirdekod.com/images/logo-text.png" alt="Çekirdekod" class="h-4 sm:h-5 brightness-90 hover:brightness-100 transition" />
        </a>
        <div class="text-[11px] text-slate-600">
            Powered by <a href="https://cekirdekod.com/" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-purple-400 underline decoration-slate-700">Çekirdekod</a> AI & Cloud Architecture
        </div>
    </footer>

    <script>
        lucide.createIcons();

        function toggleTokenVisibility() {
            const input = document.getElementById('input-token');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        async function submitLogin() {
            const token = document.getElementById('input-token').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('btn-submit');

            if (!token) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Doğrulanıyor...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorText.textContent = data.detail || 'Geçersiz erişim tokeni';
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Giriş Yap</span><i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>';
                    lucide.createIcons();
                }
            } catch (e) {
                errorText.textContent = 'Bağlantı hatası oluştu';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Giriş Yap</span><i data-lucide="arrow-right" class="w-4 h-4 ml-1"></i>';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
